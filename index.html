const ptsNow = () => score().total * PTS;
const ptsChip = () => `<span class="ptschip${S.ranked === false ? ' train' : ''}" id="pts" title="${S.ranked === false ? 'Partida de treino: não conta para o ranking' : '100 pontos por acerto'}">${ico('star', 14, 0)}<b>${fmtP(ptsNow())}</b> pts${S.ranked === false ? ' · treino' : ''}</span>`;
const etapaOf = s => ({intro1: 'filtros', filter: 'filtros', intro2: 'perfis', swipe: 'perfis', matchT: 'chat', chat: 'chat', result: 'fim', ranking: 'fim'})[s] || 'filtros';
function record(){
  const sc = score(), fim = !!S.t1;
  const r = {nome: (me().nome || 'Participante').slice(0, 20), pts: sc.total * PTS, acertos: sc.total, f: sc.f, p: sc.p, c: sc.c,
    etapa: fim ? 'fim' : etapaOf(S.screen), t: Math.max(0, (S.t1 || Date.now()) - (S.t0 || Date.now())), ini: S.t0 || Date.now(), at: Date.now(), rod: RANK.rod || 0};
  if (fim) r.tier = sc.tier;
  return r;
}
let syncT = 0;
function syncScore(now){
  if (!S.ranked || !S.t0) return;
  clearTimeout(syncT);
  const run = async () => {
    if (Board.live && Date.now() - ROD.at > 15000) await refreshRodada();
    if (!S.ranked) return;
    return Board.put(RANK.pid, record()).catch(() => { syncT = setTimeout(run, 4000); });
  };
  if (now) run(); else syncT = setTimeout(run, 500);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) syncScore(true); });
function bump(ok){
  const chip = $('#pts');
  if (chip){
    chip.querySelector('b').textContent = fmtP(ptsNow());
    if (ok){
      chip.classList.remove('pop'); void chip.offsetWidth; chip.classList.add('pop');
      const f = document.createElement('span'); f.className = 'plus'; f.textContent = '+' + PTS; f.setAttribute('aria-hidden', 'true');
      chip.appendChild(f); setTimeout(() => f.remove(), 950);
    }
  }
  syncScore();
}
function startAttempt(){
  if (S.t0) return;
  S.t0 = Date.now(); S.ranked = !RANK.done; save(); syncScore(true);
}
refreshRodada();

VIEWS.ranking = () => {
  let mode = S.rkMode || 'pts';
  app.innerHTML = `<section class="screen rank">
    <div class="rkhead"><button class="back" id="back" aria-label="Voltar">${ico('arrowL', 22, 3.8)}</button><div><span class="eyebrow">Ranking ao vivo</span><h2>Quem deu mais match</h2></div><span class="live"><i class="livedot"></i> ao vivo</span></div>
    <div class="mypos" id="mypos">Buscando o placar…</div>
    <div class="rktabs" role="tablist"><button role="tab" class="tab" data-m="pts">${ico('trophy', 16, 3.4)} Mais pontos</button><button role="tab" class="tab" data-m="time">${ico('bolt', 16, 3.4)} Mais rápidos</button></div>
    <div class="scroll"><div class="lwrap" id="lw"></div><p class="help center" id="rkinfo"></p></div>
    <div class="foot"><button class="btn primary" id="back2">Voltar ao meu resultado</button></div></section>`;
  let upd, last = null;
  const setMode = m => {
    mode = S.rkMode = m;
    app.querySelectorAll('.rktabs .tab').forEach(t => { const on = t.dataset.m === m; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); });
    $('#lw').innerHTML = '';
    upd = listUpdater($('#lw'), {rowH: 64, max: 60, meId: RANK.pid, mode: m});
    if (last) draw(last);
  };
  const draw = data => {
    const L = rankedList(data), F = fastList(data);
    const list = mode === 'time' ? F : L;
    upd(list);
    const i = L.findIndex(r => r.id === RANK.pid), j = F.findIndex(r => r.id === RANK.pid);
    if (i >= 0){
      const r = L[i];
      $('#mypos').innerHTML = `Você está em <b>${i + 1}º</b> de ${L.length} em pontos · <b>${fmtP(r.pts)}</b> pts` +
        (r.etapa === 'fim' ? `<small>${j >= 0 ? `Em “Mais rápidos”, você está em <b>${j + 1}º</b> · ${fmtT(r.t)}` : `Seu tempo: ${fmtT(r.t)}. Para entrar em “Mais rápidos” são precisos ${MIN_FAST} acertos.`}</small>` : '') +
        (S.ranked === false ? '<small>Sua partida de treino não entra no placar.</small>' : '');
    } else $('#mypos').textContent = S.ranked === false ? 'Esta partida foi de treino: só a primeira vale para o ranking.' : 'Você ainda não aparece no ranking.';
    $('#rkinfo').textContent = !Board.live ? 'Modo local: este ranking mostra só as partidas deste aparelho. Para juntar todos os participantes, o ranking online precisa estar configurado.'
      : mode === 'time' ? `Só entra quem terminou com pelo menos ${MIN_FAST} acertos · atualiza sozinho a cada 5 segundos` : `Empate em pontos fica com quem terminou mais rápido · atualiza sozinho a cada 5 segundos`;
    if (!list.length) $('#lw').innerHTML = `<p class="help center">${mode === 'time' ? 'Ninguém terminou com acertos suficientes ainda.' : 'Ninguém no placar ainda.'}</p>`;
  };
  app.querySelectorAll('.rktabs .tab').forEach(t => t.onclick = () => setMode(t.dataset.m));
  setMode(mode);
  cleanup = Board.watch(data => {
    if (!data){ $('#rkinfo').textContent = 'Sem conexão com o ranking agora. Tentando de novo…'; return; }
    last = data; draw(data);
  }, {every: 5000});
  $('#back').onclick = $('#back2').onclick = () => go('result');
};

    let conf = '';
    const cols = ['#FFD36E', '#00C2D7', '#FF6FA8', '#FFFFFF', '#7FB2FF', '#7BD88F'];
    for (let i = 0; i < 70; i++) conf += `<i style="left:${(i * 13.7) % 100}%;background:${cols[i % cols.length]};animation-delay:-${((i * .37) % 4).toFixed(2)}s;animation-duration:${(3 + (i % 5) * .5).toFixed(1)}s"></i>`;
    const f = F[0];
    d.innerHTML = `<div class="confetti" aria-hidden="true">${conf}</div><span class="eyebrow">Em busca do match perfeito</span><h1>Temos vencedores!</h1>
      <div class="podium">${podiumHTML(L, true)}</div>
      <div class="fastwin">${ico('bolt', 28, 3.2)}<span>Mais rápido</span>${f ? `<b>${esc(f.nome)}</b><em>${fmtT(f.t)} · ${fmtP(f.pts)} pts</em>` : `<b>—</b><em>ninguém terminou com ${MIN_FAST}+ acertos</em>`}</div>
      <button class="btn light small" id="closeR">Voltar ao placar</button>`;
    app.querySelector('.screen').appendChild(d);
    d.querySelector('#closeR').onclick = () => d.remove();
  };
};

/* ---------------- Área do administrador: ?tela=admin ---------------- */
/* Senha da área (não diferencia maiúsculas). Para trocar, gere o SHA-256 da nova senha em minúsculas. */
const ADMIN_PIN_HASH = 'eb08bc47a28de3c7e16e0c4deb65fbe8e1f223076b2df8677751ffc00ae1462b';
const ADMIN_KEY = 'matchPerfeito.admin';
async function sha256(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const TIER_L = {match: 'Deu Match', quase: 'Quase lá', ghost: 'Ghosting'};
/* Ranking do admin: mais acertos; empate, menor tempo de conclusão (quem já terminou fica à frente) */
const adminList = data => validRecs(data).sort((a, b) =>
  (b.acertos || 0) - (a.acertos || 0) || (a.etapa === 'fim' ? 0 : 1) - (b.etapa === 'fim' ? 0 : 1) || (a.t || 0) - (b.t || 0));
const fmtHora = ms => ms ? new Date(ms).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}) : '—';

VIEWS.adminGate = () => {
  document.body.classList.add('wide', 'adm-body');
  document.title = 'Admin · Em Busca do Match Perfeito';
  app.innerHTML = `<section class="screen admgate">
    <form class="gatecard" id="gf" autocomplete="off">
      <div class="glogo">${LOGO}</div>
      <span class="eyebrow">Área do administrador</span>
      <h1>Ranking ao vivo da dinâmica</h1>
      <label class="field" for="pin"><span>Senha</span><input id="pin" type="password" autocomplete="current-password" placeholder="Digite a senha do admin"></label>
      <p class="gerr" id="gerr" hidden>Senha incorreta. Confira e tente de novo.</p>
      <button class="btn primary" type="submit">Entrar</button>
    </form></section>`;
  $('#gf').onsubmit = async e => {
    e.preventDefault();
    const v = $('#pin').value.trim().toLowerCase();
    let ok = false;
    try { ok = (await sha256(v)) === ADMIN_PIN_HASH; } catch (err) { ok = false; }
    if (ok){ try { sessionStorage.setItem(ADMIN_KEY, '1'); } catch (err) {} VIEWS.admin(); }
    else { $('#gerr').hidden = false; $('#pin').select(); }
  };
  setTimeout(() => $('#pin').focus(), 50);
};

VIEWS.admin = () => {
  let unlocked = false;
  try { unlocked = sessionStorage.getItem(ADMIN_KEY) === '1'; } catch (e) {}
  if (!unlocked) return VIEWS.adminGate();
  document.body.classList.add('wide', 'adm-body');
  document.title = 'Admin · Em Busca do Match Perfeito';
  const telao = location.pathname + '?tela=ranking' + (SALA !== 'principal' ? `&sala=${encodeURIComponent(SALA)}` : '');
  app.innerHTML = `<section class="screen adm">
    <header class="admhead">
      <div class="admlogo">${LOGO}</div>
      <div class="admtitle"><span class="eyebrow">Área do administrador</span><h1>Ranking ao vivo</h1><small>Sala <b>${esc(SALA)}</b> · critério: mais acertos; empate, menor tempo de conclusão</small></div>
      <div class="admact"><span class="live" id="alive"><i class="livedot"></i> ao vivo</span>
        <a class="btn outline small" href="${esc(telao)}" target="_blank" rel="noopener">${ico('trophy', 18, 3.2)} Abrir telão</a>
        <button class="btn outline small" id="csv">${ico('sheet', 18, 3.2)} Exportar CSV</button>
        <button class="btn outline small danger" id="reset">${ico('dice', 18, 3.2)} Zerar ranking</button>
        <button class="btn outline small" id="out">Sair</button></div>
    </header>
    <div class="admscroll">
      ${Board.live ? '' : '<p class="admwarn">Modo local: o painel mostra só as partidas feitas neste navegador. Configure o Firebase para acompanhar todos os participantes.</p>'}
      <div class="kpis">
        <div><span>Participantes</span><strong id="k1">0</strong></div>
        <div><span>Jogando agora</span><strong id="k2">0</strong></div>
        <div><span>Terminaram</span><strong id="k3">0</strong></div>
        <div><span>Média de acertos</span><strong id="k4">—</strong></div>
        <div><span>Melhor tempo</span><strong id="k5">—</strong></div>
      </div>
      <h2 class="admh2">${ico('trophy', 24, 3.2)} Top 3 vencedores <small>entre quem já terminou</small></h2>
      <div class="top3" id="top3"></div>
      <div class="admbar"><h2 class="admh2">Classificação geral <small id="cnt"></small></h2><input id="q" type="search" placeholder="Buscar participante" aria-label="Buscar participante"></div>
      <div class="admtable"><table>
        <thead><tr><th>#</th><th>Participante</th><th>Acertos</th><th>Tempo</th><th>Situação</th><th class="num">Filtros</th><th class="num">Perfis</th><th class="num">Chat</th><th>Início</th></tr></thead>
        <tbody id="tb"><tr><td colspan="9" class="empty">Aguardando participantes…</td></tr></tbody>
      </table></div>
      <p class="admfoot" id="afoot"></p>
    </div></section>`;
  let L = [], prev = new Map(), q = '', lastData = {};
  const medal = ['🥇', '🥈', '🥉'];
  const draw = () => {
    const fin = L.filter(r => r.etapa === 'fim');
    $('#k1').textContent = L.length;
    $('#k2').textContent = L.length - fin.length;
    $('#k3').textContent = fin.length;
    $('#k4').textContent = fin.length ? (fin.reduce((n, r) => n + (r.acertos || 0), 0) / fin.length).toLocaleString('pt-BR', {maximumFractionDigits: 1}) + ` / ${TOTAL}` : '—';
    $('#k5').textContent = fin.length ? fmtT(Math.min(...fin.map(r => r.t || 0))) : '—';
    const top = fin.slice(0, 3);
    $('#top3').innerHTML = [0, 1, 2].map(i => { const r = top[i]; return `<div class="tcard t${i + 1}${r ? '' : ' empty'}"><span class="medal">${medal[i]}</span>${r ? `<span class="rface big">${faceOf(r)}</span><div><b>${esc(r.nome)}</b><span>${r.acertos}/${TOTAL} acertos · ${fmtT(r.t)}</span><em>${TIER_E[r.tier] || ''} ${TIER_L[r.tier] || ''}</em></div>` : `<div><b>${i + 1}º lugar</b><span>Aguardando alguém terminar</span></div>`}</div>`; }).join('');
    const shown = q ? L.filter(r => r.nome.toLowerCase().includes(q)) : L;
    $('#cnt').textContent = `${L.length} participante${L.length === 1 ? '' : 's'}${q ? ` · ${shown.length} na busca` : ''}`;
    const winners = new Set(top.map(r => r.id));
    $('#tb').innerHTML = shown.length ? shown.map(r => {
      const pos = L.indexOf(r) + 1, changed = prev.has(r.id) && prev.get(r.id) !== `${r.acertos}|${r.etapa}`;
      const pct = Math.round((r.acertos || 0) / TOTAL * 100);
      return `<tr class="${winners.has(r.id) ? 'win w' + (top.indexOf(r) + 1) : ''}${changed ? ' flash' : ''}">
        <td class="pos">${winners.has(r.id) ? medal[top.indexOf(r)] : pos + 'º'}</td>
        <td><span class="who"><span class="rface">${faceOf(r)}</span><b>${esc(r.nome)}</b></span></td>
        <td><span class="acc"><b>${r.acertos || 0}</b>/${TOTAL}<i><u style="width:${pct}%"></u></i></span></td>
        <td class="num">${r.etapa === 'fim' ? `<b>${fmtT(r.t)}</b>` : `<span class="muted">${fmtT(r.t)} até agora</span>`}</td>
        <td>${r.etapa === 'fim' ? `<span class="tag done">${TIER_E[r.tier] || '✓'} ${TIER_L[r.tier] || 'Terminou'}</span>` : `<span class="tag play"><i class="livedot"></i> ${ETAPA[r.etapa] || 'Início'}</span>`}</td>
        <td class="num">${r.f ?? '—'}/${FILTERS.length}</td><td class="num">${r.p ?? '—'}/${PROFILES.length}</td><td class="num">${r.c ?? '—'}/${CHAT.length}</td>
        <td class="num muted">${fmtHora(r.ini)}</td></tr>`;
    }).join('') : `<tr><td colspan="9" class="empty">${q ? 'Ninguém com esse nome.' : 'Aguardando participantes…'}</td></tr>`;
    prev = new Map(L.map(r => [r.id, `${r.acertos}|${r.etapa}`]));
    $('#afoot').textContent = `Atualizado às ${new Date().toLocaleTimeString('pt-BR')}${ROD.v ? ` · rodada iniciada às ${fmtHora(ROD.v)}` : ''}. Para começar uma turma nova, use “Zerar ranking” (exporte o CSV antes, se quiser guardar os resultados) ou outra sala no endereço (?sala=turma2).`;
  };
  cleanup = Board.watch(data => {
    if (!data){ $('#alive').classList.add('off'); $('#alive').lastChild.textContent = ' reconectando'; return; }
    $('#alive').classList.remove('off'); $('#alive').lastChild.textContent = ' ao vivo';
    lastData = data; L = adminList(data); draw();
  }, {stream: true, every: 3000});
  $('#q').oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
  $('#out').onclick = () => { try { sessionStorage.removeItem(ADMIN_KEY); } catch (e) {} if (cleanup){ cleanup(); cleanup = null; } VIEWS.adminGate(); };
  const toast = msg => { const t = document.createElement('div'); t.className = 'admtoast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 4200); };
  $('#reset').onclick = () => {
    const m = document.createElement('div'); m.className = 'admmodal';
    m.innerHTML = `<form class="rmcard" id="rf" role="dialog" aria-modal="true" aria-labelledby="rmt" autocomplete="off">
      <h2 id="rmt">Zerar o ranking?</h2>
      <p>Começa uma rodada nova na sala <b>${esc(SALA)}</b>: a classificação, o Top 3 e o telão ficam vazios, e quem já jogou pode jogar de novo valendo ponto.</p>
      <p class="rmnote">Os resultados atuais saem do ranking. Se quiser guardar, exporte o CSV antes. <button type="button" class="linkbtn" id="rcsv">Exportar CSV agora</button></p>
      <label class="field" for="rpin"><span>Senha do admin</span><input id="rpin" type="password" placeholder="Digite a senha para confirmar"></label>
      <p class="gerr" id="rerr" hidden></p>
      <div class="rmact"><button type="button" class="btn outline small" id="rno">Cancelar</button><button type="submit" class="btn small dangerfill" id="rok">Zerar ranking</button></div>
    </form>`;
    document.body.appendChild(m);
    const close = () => m.remove();
    m.onclick = e => { if (e.target === m) close(); };
    m.querySelector('#rno').onclick = close;
    m.querySelector('#rcsv').onclick = () => $('#csv').click();
    setTimeout(() => m.querySelector('#rpin').focus(), 50);
    m.querySelector('#rf').onsubmit = async e => {
      e.preventDefault();
      const pin = m.querySelector('#rpin').value.trim().toLowerCase(), err = m.querySelector('#rerr'), ok = m.querySelector('#rok');
      let good = false; try { good = (await sha256(pin)) === ADMIN_PIN_HASH; } catch (x) {}
      if (!good){ err.textContent = 'Senha incorreta. Confira e tente de novo.'; err.hidden = false; return; }
      ok.disabled = true; ok.textContent = 'Zerando…';
      try {
        const v = await Board.novaRodada(pin);
        ROD.v = v; ROD.at = Date.now(); ROD.ready = true;
        await refreshRodada();
        close(); L = adminList(lastData); prev = new Map(); draw();
        toast(`Ranking zerado. Nova rodada começou às ${fmtHora(v)}.`);
      } catch (x) {
        ok.disabled = false; ok.textContent = 'Zerar ranking';
        err.textContent = 'Não deu para zerar. Confira a conexão e se as regras do Firebase foram atualizadas, e tente de novo.'; err.hidden = false;
      }
    };
  };
  $('#csv').onclick = () => {
    const rows = [['Posição', 'Nome', 'Acertos', 'Pontos', 'Tempo', 'Situação', 'Resultado', 'Filtros', 'Perfis', 'Chat', 'Início']]
      .concat(L.map((r, i) => [i + 1, r.nome, r.acertos, r.pts, fmtT(r.t), r.etapa === 'fim' ? 'Terminou' : 'Jogando · ' + (ETAPA[r.etapa] || ''), TIER_L[r.tier] || '', r.f, r.p, r.c, fmtHora(r.ini)]));
    const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
    a.download = `ranking-match-perfeito-${SALA}-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
};

/* Abre direto em uma tela para testes: #tela-resultado etc. Sem hash, começa na splash. */
const DEMO = location.hash.replace('#', '');
if (DEMO === 'demo-perfis'){ S = fresh(); S.ans.f = FILTERS.map(q => q.c); S.screen = 'swipe'; }
else if (DEMO === 'demo-chat'){ S = fresh(); S.ans.f = FILTERS.map(q => q.c); S.ans.p = PROFILES.map(p => p.m); S.p = PROFILES.length; S.screen = 'chat'; }
else if (DEMO.startsWith('demo-res')){ S = fresh(); S.ans.f = FILTERS.map(q => q.c); S.ans.p = PROFILES.map(p => p.m); S.ans.c = CHAT.map(q => q.c); S.p = PROFILES.length; S.c = CHAT.length;
  if (DEMO === 'demo-res-quase'){ S.ans.p = PROFILES.map((p, i) => i < 4 ? !p.m : p.m); S.ans.c = CHAT.map((q, i) => i < 3 ? (q.c + 1) % q.o.length : q.c); }
  if (DEMO === 'demo-res-ghost'){ S.ans.f = FILTERS.map(q => (q.c + 1) % q.o.length); S.ans.p = PROFILES.map(() => true); S.ans.c = CHAT.map(q => (q.c + 1) % q.o.length); }
  S.screen = 'result'; }
const TELA = (QS.get('tela') || '').toLowerCase() || ({'#ranking': 'ranking', '#admin': 'admin'})[location.hash] || '';
if (TELA === 'ranking') VIEWS.board(); else if (TELA === 'admin') VIEWS.admin(); else render();
})();
</script>
