<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2148A0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Em Busca do Match Perfeito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Damion&family=Nunito+Sans:opsz,wght@6..12,500;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* Paleta do logo e do banner "Em busca do Match Perfeito". Layout: app de tela única, telas empilhadas, mobile-first. */
:root{
  --royal:#2148A0; --deep:#003D9C; --mid:#085FAA; --cyan:#00C2D7; --ice:#D2EFF5;
  --ink:#1B2540; --muted:#5B6782; --line:#DCE9F0; --paper:#F3F9FC; --coral:#FF5A6E;
  --ok-bg:#E6FAFC; --bad-bg:#FFF0F2;
  --f-display:'Baloo 2','Nunito Sans',system-ui,sans-serif;
  --f-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-script:'Damion','Baloo 2',cursive;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#0A2559;font-family:var(--f-body);color:var(--ink);overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#app{position:relative;height:100%;width:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--paper)}
@media (min-width:640px) and (min-height:640px){
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#1A6FB8 0%,#0B3A8A 45%,#071D4E 100%)}
  #app{height:min(860px,calc(100% - 48px));width:400px;border-radius:38px;box-shadow:0 0 0 9px #0c2457,0 30px 80px rgba(0,10,40,.55)}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);animation:screenIn .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 20px 20px}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font:800 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}

/* Botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 22px;border:0;border-radius:999px;font:800 18px/1 var(--f-display);transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--mid),var(--royal));color:#fff;box-shadow:0 10px 24px rgba(33,72,160,.35)}
.btn.light{background:#fff;color:var(--royal);box-shadow:0 10px 24px rgba(0,20,60,.18)}
.btn.outline{background:transparent;color:var(--royal);border:2px solid #BFD6E6}
.btn.outline-w{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55)}
.btn.small{min-height:46px;font-size:16px}

/* Topo com progresso */
.topbar{padding:14px 20px 10px;display:flex;flex-direction:column;gap:9px}
.prog{height:6px;border-radius:99px;background:#DDEBF2;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--mid));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{font:700 13px/1 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}

/* Splash */
.splash{background:linear-gradient(180deg,#F4FCFE 0%,#D7F2F8 34%,#71D6E6 66%,#1786C4 100%);overflow:hidden}
.floaters{position:absolute;inset:0;pointer-events:none}
.floaty{position:absolute;animation:bob 6s ease-in-out infinite;transform:rotate(var(--r,0deg))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(var(--r,0deg))}}
.splash-main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px 0;text-align:center;gap:18px}
.logo{display:block;width:100%;height:auto;color:var(--royal)}
.splash .logo{max-width:300px;filter:drop-shadow(0 6px 14px rgba(255,255,255,.9))}
.tagline{margin:0;font:700 17px/1.4 var(--f-body);color:var(--deep);max-width:300px}
.chipline{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.75);font:800 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--royal)}
.splash .foot{position:relative}
.fine{margin:0;text-align:center;font:700 13px/1.4 var(--f-body);color:#fff;text-shadow:0 1px 6px rgba(0,30,80,.35)}

/* Como jogar */
.howto .scroll{display:flex;flex-direction:column;gap:18px;padding-top:28px}
.rule{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}
.rule .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center}
.rule p{margin:0;font:600 15.5px/1.4 var(--f-body)}
.rule b{font-weight:800}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{background:var(--ice);border-radius:16px;padding:12px 8px;text-align:center}
.stats3 strong{display:block;font:800 22px/1 var(--f-display);color:var(--royal)}
.stats3 span{font:700 12px/1.2 var(--f-body);color:var(--mid)}

/* Missão */
.mission .scroll{display:flex;flex-direction:column;gap:16px;padding-top:22px}
.lead{margin:0;font:600 16px/1.5 var(--f-body);color:#33405E}
.event{border-radius:24px;padding:18px;background:linear-gradient(140deg,#fff 0%,#EAF8FB 100%);border:1px solid #CFE7EF;box-shadow:0 10px 28px rgba(8,95,170,.08)}
.event h3{display:flex;align-items:center;gap:10px;font-size:20px;line-height:1.15;color:var(--ink)}
.event h3 .dot{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--royal);color:#fff}
.event p{margin:8px 0 14px;font:600 14.5px/1.4 var(--f-body);color:var(--muted)}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat2 div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat2 strong{display:block;font:800 24px/1.05 var(--f-display);color:var(--ink)}
.stat2 span{font:600 12.5px/1.3 var(--f-body);color:var(--muted)}
.lookfor h4{margin:0 0 8px;font:800 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lf{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.lf .ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ice);color:var(--royal)}
.lf small{display:block;font:700 12px/1.2 var(--f-body);color:var(--muted)}
.lf b{font:800 15px/1.3 var(--f-body)}
.missionbox{border-radius:18px;padding:16px;background:linear-gradient(135deg,var(--royal),var(--mid));color:#fff;font:600 15.5px/1.45 var(--f-body)}
.missionbox b{font-weight:800;color:#9FF0FA}

/* Intro de etapa */
.stage .scroll{display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:left;padding-top:24px}
.bignum{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;font:800 40px/1 var(--f-display);color:#fff;background:linear-gradient(135deg,var(--cyan),var(--royal));box-shadow:0 12px 26px rgba(33,72,160,.3)}
.stage h2{font-size:30px;line-height:1.08}
.tip{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px dashed #9FD8E6;border-radius:16px;padding:12px 14px;font:600 14.5px/1.4 var(--f-body)}
.mini{display:flex;gap:10px}
.mini div{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:700 13px/1.25 var(--f-body)}

/* Filtros */
.q{font-size:24px;line-height:1.15;margin:6px 0 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border-radius:16px;background:#fff;border:2px solid var(--line);font:600 15.5px/1.38 var(--f-body);transition:border-color .15s,background .15s,opacity .2s}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ice);color:var(--royal);font:800 13px/1 var(--f-body);margin-top:-2px}
.opt:not(:disabled):active{background:var(--ice)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--cyan);background:var(--ok-bg)}
.opt.right .l{background:var(--cyan);color:#fff}
.opt.wrong{border-color:var(--coral);background:var(--bad-bg)}
.opt.wrong .l{background:var(--coral);color:#fff}
.opt.dim{opacity:.5}
.fb{margin-top:14px;border-radius:16px;padding:13px 15px;border-left:6px solid var(--cyan);background:var(--ok-bg);animation:screenIn .3s both}
.fb.bad{border-left-color:var(--coral);background:var(--bad-bg)}
.fb b{display:block;font:800 16px/1.2 var(--f-display);margin-bottom:3px}
.fb p{margin:0;font:600 14.5px/1.42 var(--f-body)}

/* Swipe */
.swipe{background:linear-gradient(180deg,var(--paper),#E6F3F8)}
.deck{position:relative;flex:1;min-height:0;margin:2px 14px 0}
.card{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:#BFE6F0;box-shadow:0 16px 36px rgba(10,40,90,.22);touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;cursor:grab}
.card.next{transform:translate3d(0,16px,0) scale(.94);box-shadow:0 8px 18px rgba(10,40,90,.12)}
.card.grabbing{cursor:grabbing}
.card.flying{pointer-events:none}
.card,.card *{-webkit-touch-callout:none}
.card .art{position:absolute;inset:0;width:100%;height:100%;display:block}
.info{position:absolute;left:0;right:0;bottom:0;padding:96px 18px 18px;color:#fff;background:linear-gradient(to top,rgba(3,18,52,.97) 0%,rgba(3,18,52,.9) 52%,rgba(3,18,52,0) 100%)}
.info h3{font:800 27px/1.05 var(--f-display)}
.info h3 .age{font-weight:600;opacity:.88}
.role{margin-top:5px;font:800 15px/1.3 var(--f-body)}
.org{font:600 13.5px/1.3 var(--f-body);opacity:.82}
.dist{display:flex;align-items:center;gap:5px;margin-top:6px;font:700 13px/1.2 var(--f-body);color:#9FF0FA}
.bio{margin:10px 0;font:600 14px/1.42 var(--f-body);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.warn{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:5px 10px;border-radius:9px;background:#FFE27A;color:#3A2A00;font:800 12.5px/1.2 var(--f-body);transform:rotate(-1.5deg);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.warn.ok{background:#BFF3D2;color:#0B4A2A}
.warn.stop{background:#FFC9D1;color:#6A0D1C}
.card.old .art{filter:sepia(.55) saturate(.85) contrast(.94)}
.tag{font:700 12px/1 var(--f-body);padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3)}
.stamp{--k:0;position:absolute;top:52px;z-index:3;padding:5px 14px 1px;border:5px solid;border-radius:12px;font:800 42px/1.05 var(--f-display);letter-spacing:.05em;opacity:0;background:rgba(3,18,52,.24);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);text-shadow:0 2px 10px rgba(0,0,0,.2);box-shadow:0 4px 18px rgba(0,0,0,.12);pointer-events:none}
.stamp.yes{left:22px;color:#3DF0FF;border-color:#3DF0FF;transform-origin:center;transform:rotate(-16deg) scale(calc(.78 + .22 * var(--k)))}
.stamp.no{right:22px;color:#FF6B7D;border-color:#FF6B7D;transform-origin:center;transform:rotate(16deg) scale(calc(.78 + .22 * var(--k)))}
.actions{display:flex;justify-content:center;align-items:center;gap:30px;padding:14px 0 calc(14px + env(safe-area-inset-bottom))}
.act{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;background:#fff;box-shadow:0 8px 22px rgba(10,40,90,.18);transition:transform .1s ease-out,background .15s,color .15s,box-shadow .15s}
.act:active{transform:scale(.9)}
.act.no{color:var(--coral)}
.act.yes{background:linear-gradient(135deg,var(--cyan),var(--mid));color:#fff}
.act.no.hot{background:var(--coral);color:#fff;box-shadow:0 0 0 8px rgba(255,90,110,.18),0 10px 24px rgba(255,90,110,.35)}
.act.yes.hot{box-shadow:0 0 0 9px rgba(0,194,215,.22),0 10px 26px rgba(0,150,200,.45)}
.act-label{display:block;margin-top:6px;font:800 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.toast{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 8px);z-index:40;background:#fff;border-radius:16px;padding:12px 14px 12px 16px;border-left:6px solid var(--cyan);box-shadow:0 14px 32px rgba(10,40,90,.28);opacity:0;transform:translateY(-14px);transition:opacity .22s,transform .22s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.bad{border-left-color:var(--coral)}
.toast b{display:block;font:800 17px/1.2 var(--f-display)}
.toast p{margin:3px 0 0;font:600 13.5px/1.38 var(--f-body);color:#3C4866}

/* Deu match */
.matchT{color:#fff;text-align:center;background:radial-gradient(130% 80% at 50% 25%,#22A6D6 0%,#0E4FA6 52%,#06215A 100%);overflow:hidden}
.matchT .scroll{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.bigscript{font:400 74px/1 var(--f-script);text-shadow:0 6px 24px rgba(0,0,0,.25);transform:rotate(-4deg);margin:0}
.pair{position:relative;display:flex;justify-content:center;margin:14px 0 6px}
.pair .face{width:124px;height:124px;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.3);background:#fff}
.pair .face:first-child{transform:rotate(-7deg) translateX(14px)}
.pair .face:last-child{transform:rotate(7deg) translateX(-14px)}
.pair .heart{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;background:#fff;color:var(--coral);display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.matchT p{margin:0;max-width:300px;font:700 16.5px/1.45 var(--f-body)}
.matchT .second{font-weight:600;font-size:14.5px;opacity:.9}
.risers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.riser{position:absolute;bottom:-40px;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:.9}100%{transform:translateY(-115vh) scale(1.1);opacity:0}}

/* Chat */
.chat{background:#fff}
.chathead{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff;position:relative;z-index:2}
.chathead .av{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid var(--ice);padding:0;background:#fff}
.chathead .who{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.chathead .who b{display:block;font:800 17px/1.15 var(--f-display)}
.chathead .who small{display:flex;align-items:center;gap:6px;font:700 12.5px/1.2 var(--f-body);color:var(--muted)}
.online{width:8px;height:8px;border-radius:50%;background:#16C47F;box-shadow:0 0 0 3px rgba(22,196,127,.2)}
.chatprog{padding:8px 16px 8px;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding:14px 14px 10px;background:linear-gradient(180deg,#F5FAFD,#E9F4F9)}
.b{max-width:84%;padding:10px 14px;border-radius:20px;margin:3px 0;font:600 15px/1.42 var(--f-body);animation:pop .26s cubic-bezier(.2,.9,.3,1.2) both;overflow-wrap:anywhere}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.b.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.b.me{align-self:flex-end;background:linear-gradient(135deg,var(--mid),var(--royal));color:#fff;border-bottom-right-radius:6px}
.sys{align-self:center;margin:12px 0 6px;padding:6px 12px;border-radius:99px;background:#DDECF3;font:800 12px/1.3 var(--f-body);color:#3E4C6B;text-align:center;animation:pop .26s both}
.typing{align-self:flex-start;display:flex;gap:5px;padding:13px 16px;background:#fff;border:1px solid var(--line);border-radius:20px;border-bottom-left-radius:6px;margin:3px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:#9AB0C4;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.day{align-self:center;margin:0 0 10px;font:800 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.b.them+.b.them{margin-top:0}
.mewrap{align-self:flex-end;max-width:84%;display:flex;flex-direction:column;align-items:flex-end;margin:4px 0 6px}
.mewrap .b.me{position:relative;max-width:100%;margin:0}
.react{position:absolute;left:-12px;bottom:-12px;font-size:14px;line-height:1;background:#fff;border-radius:99px;padding:4px 5px;box-shadow:0 2px 8px rgba(10,40,90,.2);animation:pop .3s cubic-bezier(.2,.9,.3,1.5) both}
.note{margin-top:10px;font:800 11.5px/1.25 var(--f-body);color:#008A9D;text-align:right;animation:pop .3s both}
.note.bad{color:#D2364E}
.seal{align-self:center;width:92%;margin:8px 0 10px;padding:10px 14px;border-radius:14px;background:var(--ok-bg);border:1.5px dashed var(--cyan);font:600 13.5px/1.4 var(--f-body);color:#0D3E57;animation:pop .3s both}
.seal b{display:block;margin-bottom:2px;font:800 11.5px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
.seal.bad{background:var(--bad-bg);border-color:var(--coral);color:#5E1A26}
.seal.bad b{color:#D2364E}
.replies{flex:none;max-height:56%;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 20px rgba(10,40,90,.06)}
.replies:empty{display:none}
.replies .hint{font:800 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:2px 4px}
.reply{width:100%;text-align:left;padding:11px 14px;border-radius:16px;border:2px solid var(--line);background:#F6FAFC;font:700 14.5px/1.35 var(--f-body);animation:pop .25s both}
.reply small{display:block;margin-top:3px;font:600 12px/1.25 var(--f-body);color:var(--muted)}
.reply:active{background:var(--ice);border-color:#9FD8E6}

/* Resultado */
.result{overflow:hidden}
.result .scroll{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:26px}
.result.t-match{background:linear-gradient(170deg,#0FB7D1 0%,#1676C2 45%,#163E98 100%);color:#fff}
.result.t-quase{background:linear-gradient(180deg,#F4FCFE 0%,#D2EFF5 100%);color:var(--ink)}
.result.t-ghost{background:linear-gradient(180deg,#0A1E4F 0%,#0D2F78 100%);color:#fff}
.ring{position:relative;width:176px;height:176px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val strong{font:800 38px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ring .val span{max-width:66%;margin-top:3px;font:800 9px/1.15 var(--f-body);letter-spacing:.05em;text-transform:uppercase;text-align:center;opacity:.85}
.rtitle{font:800 36px/1.05 var(--f-display)}
.rsub{margin:0;font:800 17px/1.35 var(--f-body)}
.rtext{margin:0;max-width:340px;font:600 15px/1.5 var(--f-body);opacity:.95}
.hits{font:800 14px/1 var(--f-body);padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.18);font-variant-numeric:tabular-nums}
.t-quase .hits{background:#fff;color:var(--royal)}
.break{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:4px}
.break div{border-radius:16px;padding:12px 6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.t-quase .break div{background:#fff;border-color:var(--line)}
.break strong{display:block;font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.break span{font:700 12px/1.2 var(--f-body);opacity:.85}
.seen{font:700 12.5px/1 var(--f-body);opacity:.7}
.vis{margin-top:6px;font:700 11px/1 var(--f-body);color:var(--muted);animation:pop .3s both}
.rnote{margin:0;max-width:340px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.16);font:700 13.5px/1.45 var(--f-body)}
.t-quase .vis{margin-top:6px;font:700 11px/1 var(--f-body);color:var(--muted);animation:pop .3s both}
.rnote{background:#fff;color:var(--ink)}
.sys.rsvp{font-size:12.5px;padding:7px 14px}
.sys.rsvp.match{background:#D9F7EC;color:#0B6B4B}
.sys.rsvp.quase{background:#FFF1D6;color:#7A5200}
.sys.rsvp.ghost{background:#FFE3E7;color:#A3213A}
.ghostfloat{animation:bob 3.4s ease-in-out infinite}

/* Revisão */
.sheet{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-end;background:rgba(4,16,44,.55);animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{width:100%;max-height:90%;display:flex;flex-direction:column;background:#fff;color:var(--ink);border-radius:26px 26px 0 0;animation:up .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.panel header h3{font-size:22px}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--ice);color:var(--royal);display:grid;place-items:center}
.list{overflow-y:auto;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.list h5{margin:16px 0 4px;font:800 11.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
.ri{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left}
.ri .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--cyan);margin-top:1px}
.ri.bad .ic{background:var(--coral)}
.ri h4{margin:0;font:800 15px/1.25 var(--f-display)}
.ri p{margin:3px 0 0;font:600 13px/1.42 var(--f-body);color:var(--muted)}
.ri p b{color:var(--ink)}
.profile-sheet .pcard{position:relative;height:min(520px,70vh);margin:0 16px calc(16px + env(safe-area-inset-bottom));border-radius:24px;overflow:hidden}
.resume{display:flex;flex-direction:column;gap:10px}


/* Transição match → conversa */
@keyframes mtL{from{opacity:0;transform:translateX(-90px) rotate(-24deg)}to{opacity:1;transform:rotate(-7deg) translateX(14px)}}
@keyframes mtR{from{opacity:0;transform:translateX(90px) rotate(24deg)}to{opacity:1;transform:rotate(7deg) translateX(-14px)}}
@keyframes mtPop{0%{opacity:0;transform:translateX(-50%) scale(.2)}70%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes mtZoom{from{opacity:0;transform:rotate(-4deg) scale(.55)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
@keyframes mtUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mtOut{to{opacity:0;transform:scale(.94) translateY(-12px)}}
.matchT .pair .face:first-child{animation:mtL .7s cubic-bezier(.2,.8,.2,1) both}
.matchT .pair .face:last-child{animation:mtR .7s cubic-bezier(.2,.8,.2,1) both}
.matchT .pair .heart{animation:mtPop .5s .55s both}
.matchT .bigscript{animation:mtZoom .55s .1s cubic-bezier(.2,.9,.3,1.3) both}
.matchT .mt-in{animation:mtUp .5s both}
.matchT .d2{animation-delay:.75s}.matchT .d3{animation-delay:1s}.matchT .d4{animation-delay:1.6s}
.matchT.leaving .scroll,.matchT.leaving .foot{animation:mtOut .3s ease-in forwards}
.mission3{max-width:320px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);text-align:left;display:flex;flex-direction:column;gap:4px}
.mission3 b{font:800 15px/1.3 var(--f-body)}
.mission3 span{font:600 13.5px/1.45 var(--f-body);opacity:.92}
.peek{display:flex;align-items:center;gap:8px}
.peek .mini{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid #fff;flex:none}
.peek .mini svg,.mc-faces svg{width:100%;height:100%;display:block}
.peek .typing{margin:0;padding:10px 13px}
.peek small{font:700 12.5px/1.2 var(--f-body);opacity:.88}
.matchcard{align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin:2px 0 14px;padding:14px 16px 12px;max-width:290px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 22px rgba(10,40,90,.08);animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
.mc-faces{display:flex}
.mc-faces>span{width:52px;height:52px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 12px rgba(10,40,90,.18);display:block}
.mc-faces>span:last-child{margin-left:-12px}
.matchcard b{font:800 15.5px/1.25 var(--f-display);color:var(--ink)}
.matchcard small{font:600 12.5px/1.4 var(--f-body);color:var(--muted)}
@media (max-height:640px){
  .mission3 span{font-size:12.5px}.peek{display:none}
  .info{padding-top:70px}.bio{-webkit-line-clamp:3}.info h3{font-size:24px}
  .act{width:60px;height:60px}.actions{padding-top:10px}
  .bigscript{font-size:60px}.pair .face{width:104px;height:104px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .riser{display:none}
}

/* ---------- Perfil, avatar e ranking ---------- */
.btn:disabled{opacity:.42;box-shadow:none;cursor:not-allowed}
.btn:disabled:active{transform:none}
.ob{background:linear-gradient(180deg,#fff 0%,var(--paper) 100%)}
.ob .scroll{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.obhead{display:flex;align-items:center;gap:14px;padding:12px 18px 4px}
.back{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--royal);display:grid;place-items:center;box-shadow:0 3px 12px rgba(10,40,90,.12)}
.dots{flex:1;display:flex;gap:6px}
.dots i{flex:1;height:5px;border-radius:99px;background:#DDEBF2;transition:background .3s}
.dots i.on{background:linear-gradient(90deg,var(--cyan),var(--mid))}
.obq{font-size:31px;line-height:1.08;margin-top:-4px}
.obq.small{font-size:24px}
.field{display:flex;flex-direction:column;gap:7px;margin:0}
.field>span{font:800 11.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input{height:58px;border-radius:16px;border:2px solid var(--line);padding:0 16px;font:700 18px var(--f-body);color:var(--ink);background:#fff;outline:none;width:100%}
.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,194,215,.15)}
.field[hidden]{display:none}
.lockbox{display:flex;align-items:center;gap:10px;height:58px;border-radius:16px;padding:0 16px;background:var(--ice);color:var(--royal)}
.lockbox b{flex:1;font:800 18px var(--f-body);color:var(--ink)}
.lockbox em{display:flex;align-items:center;gap:4px;font:800 12px var(--f-body);font-style:normal;color:var(--mid);background:#fff;padding:6px 10px;border-radius:99px}
.help{margin:0;display:flex;gap:6px;align-items:flex-start;font:600 13.5px/1.4 var(--f-body);color:var(--muted)}
.help svg{flex:none;margin-top:2px}
.help.center{justify-content:center;text-align:center;margin-top:10px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{padding:14px 18px;border-radius:99px;border:2px solid var(--line);background:#fff;font:800 15.5px/1 var(--f-body);color:var(--ink);transition:background .15s,border-color .15s,color .15s}
.pill.wide{flex-basis:100%}
.pill.on{background:var(--royal);border-color:var(--royal);color:#fff;box-shadow:0 6px 16px rgba(33,72,160,.3)}
.avb .avtop{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 18px 10px}
.avprev{position:relative;width:148px;height:184px;border-radius:24px;overflow:hidden;box-shadow:0 14px 30px rgba(10,40,90,.25);background:#BFE6F0}
.avprev .art,.th .tb .art,.rface .art,.pf .art,.mf .art{position:absolute;inset:0;width:100%;height:100%}
.dice{position:absolute;right:18px;bottom:14px;display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:99px;border:0;background:#fff;color:var(--royal);font:800 13.5px/1 var(--f-body);box-shadow:0 4px 14px rgba(10,40,90,.16)}
.dice:active{transform:rotate(-8deg) scale(.95)}
.tabs{flex:none;display:flex;gap:8px;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 14px;border-radius:99px;border:0;background:#E3EEF4;color:var(--ink);font:800 13.5px/1 var(--f-body)}
.tab.on{background:var(--ink);color:#fff}
.og.scroll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px;align-content:start;padding:4px 18px 18px}
.sw{width:100%;aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line);transition:box-shadow .15s,transform .15s}
.sw.on{box-shadow:0 0 0 3px var(--royal);transform:scale(1.04)}
.th{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;border:0;background:none;font:700 11.5px/1.15 var(--f-body);color:var(--ink);text-align:center}
.th .tb{position:relative;width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;border:3px solid transparent;background:#E3EEF4;transition:border-color .15s}
.th.tall .tb{aspect-ratio:.8}
.th.on .tb{border-color:var(--royal)}
.th.on .tb::after{content:'✓';position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--royal);color:#fff;font:800 12px/20px var(--f-body);text-align:center}
.oglabel{grid-column:1/-1;margin-top:4px;font:800 11.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.obcard .pcard.mine{position:relative;flex:none;height:min(470px,62vh);border-radius:24px;overflow:hidden;box-shadow:0 16px 36px rgba(10,40,90,.22)}
.card.static{cursor:default;touch-action:auto}
.foot.row2{flex-direction:row}
.foot.row2 .btn{flex:1}
.row2b{display:flex;gap:10px}
.row2b .btn{flex:1;font-size:14.5px;white-space:nowrap;padding:0 10px}
/* Pontos */
.metar{display:flex;align-items:center;gap:10px}
.ptschip{position:relative;display:inline-flex;align-items:center;gap:5px;padding:6px 10px 6px 8px;border-radius:99px;background:#FFF4D1;color:#7A5600;font:800 12.5px/1 var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.ptschip svg{color:#F0A800}
.ptschip.train{background:#ECEFF4;color:var(--muted)}
.ptschip.train svg{color:#9AA6B8}
.ptschip.pop{animation:popc .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes popc{40%{transform:scale(1.22)}}
.plus{position:absolute;right:2px;top:-6px;font:800 14px/1 var(--f-display);color:#E09A00;pointer-events:none;animation:plusup .95s ease-out forwards;text-shadow:0 1px 0 #fff}
@keyframes plusup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}
/* Meu perfil nas telas */
.mechip{align-self:flex-start;display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:99px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(10,40,90,.06)}
.mf{position:relative;flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;background:#BFE6F0}
.mechip b{display:block;font:800 14px/1.15 var(--f-body)}
.mechip small{display:block;font:700 11.5px/1.2 var(--f-body);color:var(--muted)}
.meline{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:99px;background:rgba(255,255,255,.16);text-align:left}
.t-quase .meline{background:#fff}
.meline .mf{width:42px;height:42px;border:2px solid #fff}
.meline b{display:block;font:800 15px/1.15 var(--f-body)}
.meline small{display:block;font:700 12px/1.2 var(--f-body);opacity:.8}
.ring{width:156px;height:156px}
.ring .val strong{font-size:33px}
.ring .val span{font-size:8px}
.rankline{margin:0;font:700 14px/1.4 var(--f-body)}
.rankline b{font-weight:800}
/* Lista do ranking */
.lwrap{position:relative;min-height:10px}
.lrow{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;border-radius:16px;background:#fff;border:1px solid var(--line);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s;will-change:transform}
.lrow.me{border:2px solid var(--cyan);background:#EFFCFE}
.pos{flex:none;width:34px;text-align:center;font:800 18px/1 var(--f-display);color:var(--royal);font-variant-numeric:tabular-nums}
.rface{position:relative;flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;background:#DDEBF2}
.rbody{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.rname{flex:1;min-width:0}
.rname b{display:block;font:800 15px/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname b em{font-style:normal;font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--cyan);color:#fff;margin-left:4px;vertical-align:2px}
.rname small{display:flex;align-items:center;gap:5px;font:700 12px/1.3 var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden}
.rpts{flex:none;text-align:right;font:800 18px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.rpts small{display:block;font:700 10px/1.2 var(--f-body);color:var(--muted)}
.livedot{flex:none;display:inline-block;width:8px;height:8px;border-radius:50%;background:#16C47F;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,196,127,.55)}70%{box-shadow:0 0 0 8px rgba(22,196,127,0)}100%{box-shadow:0 0 0 0 rgba(22,196,127,0)}}
.rank{background:linear-gradient(180deg,#fff,var(--paper))}
.rkhead{display:flex;align-items:center;gap:12px;padding:12px 18px 10px}
.rkhead>div{flex:1;min-width:0}
.rkhead h2{font-size:22px;line-height:1.1}
.live{display:inline-flex;align-items:center;gap:6px;font:800 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#0B8A5A}
.mypos{margin:0 18px 6px;padding:13px 16px;border-radius:18px;background:linear-gradient(135deg,var(--royal),var(--mid));color:#fff;font:600 15px/1.4 var(--f-body)}
.mypos b{font-weight:800;color:#9FF0FA}
.mypos small{display:block;font-size:12.5px;opacity:.85}
.rank .scroll{padding-top:8px}
/* Telão */
body.wide{display:block;background:#06215A}
body.wide #app{max-width:none;width:100%;height:100%;margin:0;border-radius:0;box-shadow:none}
.board{color:#fff;background:radial-gradient(120% 90% at 15% 0%,#1A7FC6 0%,#0B3A8A 45%,#06215A 100%);padding:clamp(16px,2.2vw,36px);gap:clamp(12px,1.6vw,22px);overflow:hidden}
.board .floaty{opacity:.25!important}
.bhead{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px}
.blogo{width:clamp(190px,19vw,330px)}
.blogo .logo{color:#fff}
.bstats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}
.bstats span{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:rgba(255,255,255,.12);font:800 clamp(13px,1.05vw,18px)/1 var(--f-body);font-variant-numeric:tabular-nums}
.bstats .live.big{background:#16C47F;color:#04331F;letter-spacing:.08em}
.bstats .live.big .livedot{background:#04331F}
.bmain{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(240px,.66fr);gap:clamp(14px,2vw,30px)}
.bpod{display:flex;flex-direction:column;min-height:0}
.bpod h2{display:flex;align-items:center;gap:10px;font-size:clamp(20px,1.9vw,32px);color:#FFE7A8}
.podium{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,1vw,18px)}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:31%;min-width:0;text-align:center}
.pod .pf{position:relative;width:clamp(70px,7.4vw,130px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.3);background:#BFE6F0}
.pod.p1 .pf{width:clamp(90px,9.6vw,170px);border-color:#FFD36E;box-shadow:0 0 0 6px rgba(255,211,110,.25),0 12px 34px rgba(0,0,0,.35)}
.pod .pf.empty{display:grid;place-items:center;background:rgba(255,255,255,.12);border-style:dashed;color:rgba(255,255,255,.6);font:800 clamp(28px,3vw,48px)/1 var(--f-display)}
.pod b{max-width:100%;font:800 clamp(14px,1.25vw,22px)/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .pp{font:800 clamp(13px,1.1vw,19px)/1.1 var(--f-display);color:#9FF0FA;font-variant-numeric:tabular-nums}
.pod .step{width:100%;margin-top:6px;border-radius:16px 16px 0 0;display:flex;justify-content:center;padding-top:10px;font:800 clamp(26px,2.8vw,50px)/1 var(--f-display);background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.06))}
.pod.p1 .step{height:clamp(110px,17vh,230px);background:linear-gradient(180deg,#FFD36E,#E9A92A);color:#5A3E00}
.pod.p2 .step{height:clamp(80px,12vh,170px)}
.pod.p3 .step{height:clamp(60px,8.5vh,125px)}
.blist{position:relative;min-height:0;overflow:hidden}
.board .lrow{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;padding-right:18px}
.board .pos{color:#9FF0FA;font-size:clamp(17px,1.4vw,24px);width:44px}
.board .rface{width:clamp(36px,3.2vw,52px);height:clamp(36px,3.2vw,52px)}
.board .rname b{font-size:clamp(15px,1.25vw,22px)}
.board .rname small{color:rgba(255,255,255,.72);font-size:clamp(11px,.9vw,15px)}
.board .rpts{color:#fff;font-size:clamp(18px,1.5vw,26px)}
.board .rpts small{color:rgba(255,255,255,.7)}
.bempty{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:20px;text-align:center;font:700 clamp(16px,1.4vw,24px)/1.4 var(--f-body);color:rgba(255,255,255,.8);border:2px dashed rgba(255,255,255,.25);border-radius:24px}
.bempty[hidden]{display:none}
.bjoin{align-self:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:clamp(14px,1.4vw,24px);border-radius:24px;background:#fff;color:var(--ink);text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.bjoin #qr{width:clamp(140px,13.5vw,250px);aspect-ratio:1}
.bjoin #qr svg{display:block;width:100%;height:auto}
.bjoin #qr img,.bjoin #qr canvas{display:block;width:100%!important;height:auto!important}
.bjoin p{margin:0;font:800 clamp(15px,1.25vw,22px)/1.2 var(--f-body);color:var(--royal)}
.bjoin small{font:700 clamp(11px,.8vw,14px)/1.3 var(--f-body);color:var(--muted);word-break:break-all}
.bjoin.noqr #qr{display:none}
.bfoot{display:flex;align-items:center;justify-content:space-between;gap:16px}
.bfoot span{font:700 clamp(12px,.95vw,15px)/1.3 var(--f-body);opacity:.8}
.bfoot .btn{width:auto;flex:none}
.reveal{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:3vw;background:radial-gradient(circle at 50% 38%,#1E9BD0 0%,#0B3A8A 50%,#06215A 100%);animation:fade .4s both;overflow:hidden}
.reveal .eyebrow{color:#9FF0FA;font-size:clamp(12px,1.1vw,18px)}
.reveal h1{font:400 clamp(54px,7vw,128px)/1 var(--f-script);text-shadow:0 8px 30px rgba(0,0,0,.3);transform:rotate(-3deg)}
.reveal .podium{flex:none;width:min(1100px,92vw);height:auto}
.reveal .pod.big .pf{width:clamp(100px,11vw,200px)}
.reveal .pod.big.p1 .pf{width:clamp(130px,14vw,250px)}
.reveal .pod.big b{font-size:clamp(18px,1.9vw,34px)}
.reveal .pod.big .pp{font-size:clamp(16px,1.5vw,26px)}
.reveal .btn{width:auto;position:relative;z-index:2}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-4vh;width:12px;height:18px;border-radius:3px;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-6vh) rotate(0)}to{transform:translateY(112vh) rotate(720deg)}}
@media (max-width:900px){
  .bmain{grid-template-columns:1fr;overflow-y:auto}
  .bjoin{display:none}
  .blist{min-height:420px}
}

.ini{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:800 16px/1 var(--f-display);letter-spacing:.02em}
.pod .pf .ini{font-size:clamp(26px,2.6vw,48px)}
.pod.p1 .pf .ini{font-size:clamp(32px,3.4vw,62px)}
.reveal .pod.big .pf .ini{font-size:clamp(38px,4vw,76px)}
.board .rface .ini{font-size:clamp(14px,1.1vw,19px)}
.rktabs{display:flex;gap:8px;padding:2px 18px 6px}
.rktabs .tab{display:inline-flex;align-items:center;gap:6px}
.bside{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,20px);justify-content:center;min-height:0}
.bside .bjoin{align-self:stretch}
.bside .bjoin #qr{width:clamp(120px,10.5vw,200px)}
.bfast{padding:clamp(12px,1.2vw,20px);border-radius:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.bfast h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:clamp(17px,1.4vw,24px);color:#FFE7A8}
.bfast>small{display:block;margin-top:8px;font:700 clamp(10px,.75vw,13px)/1.3 var(--f-body);opacity:.75}
.frow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.frow:last-child{border-bottom:0}
.fpos{width:26px;font:800 clamp(14px,1.1vw,18px)/1 var(--f-display);color:#9FF0FA}
.frow .rface{width:clamp(30px,2.5vw,40px);height:clamp(30px,2.5vw,40px)}
.frow .rface .ini{font-size:clamp(12px,.95vw,15px)}
.fname{flex:1;min-width:0}
.fname b{display:block;font:800 clamp(13px,1.05vw,17px)/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname small{font:700 clamp(10px,.8vw,13px)/1.2 var(--f-body);opacity:.75}
.ftime{font:800 clamp(16px,1.35vw,24px)/1 var(--f-display);font-variant-numeric:tabular-nums;color:#fff}
.fempty{margin:0;font:700 clamp(12px,.95vw,15px)/1.4 var(--f-body);opacity:.8}
.fastwin{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 22px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff}
.fastwin svg{color:#FFD36E}
.fastwin span{font:800 clamp(12px,1vw,16px)/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#FFE7A8}
.fastwin b{font:800 clamp(18px,1.8vw,30px)/1.1 var(--f-body)}
.fastwin em{font:700 clamp(14px,1.2vw,20px)/1 var(--f-display);font-style:normal;color:#9FF0FA}

/* ---------- Área do administrador ---------- */
body.adm-body{background:#EAF3F8}
.admgate{align-items:center;justify-content:center;background:radial-gradient(120% 90% at 15% 0%,#1A7FC6 0%,#0B3A8A 45%,#06215A 100%);padding:24px}
.gatecard{width:min(420px,100%);display:flex;flex-direction:column;gap:14px;padding:30px 28px;border-radius:28px;background:#fff;box-shadow:0 30px 80px rgba(0,10,40,.45)}
.gatecard .glogo{width:220px;align-self:center;margin-bottom:6px}
.gatecard h1{font-size:26px;line-height:1.1}
.gerr{margin:0;font:700 13.5px/1.4 var(--f-body);color:#D2364E}
.adm{background:#EAF3F8;color:var(--ink)}
.admhead{display:flex;align-items:center;gap:24px;padding:16px clamp(16px,2.4vw,36px);background:linear-gradient(120deg,#0B3A8A,#1A6FB8);color:#fff;box-shadow:0 6px 20px rgba(6,33,90,.25);flex-wrap:wrap}
.admlogo{width:170px;flex:none}
.admlogo .logo{color:#fff}
.admtitle{flex:1;min-width:220px}
.admtitle .eyebrow{color:#9FF0FA}
.admtitle h1{font-size:clamp(24px,2.2vw,34px);line-height:1.05}
.admtitle small{display:block;margin-top:4px;font:600 13px/1.3 var(--f-body);opacity:.85}
.admact{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.admact .btn{width:auto;min-height:42px;font-size:15px;color:#fff;border-color:rgba(255,255,255,.5);text-decoration:none}
.admact .live{padding:9px 14px;border-radius:99px;background:#16C47F;color:#04331F}
.admact .live .livedot{background:#04331F}
.admact .live.off{background:#FFD36E;color:#5A3E00}
.admscroll>*{flex-shrink:0}
.admtable tr.win .pos{font-size:24px}
.admscroll{flex:1;min-height:0;overflow-y:auto;padding:clamp(16px,2vw,30px) clamp(16px,2.4vw,36px) 40px;display:flex;flex-direction:column;gap:18px}
/* Zerar ranking (admin) */
.admact .btn.danger{border-color:rgba(255,170,182,.75);color:#FFD9DF}
.admmodal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(6,20,58,.55);animation:pop .2s both}
.rmcard{width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px;padding:26px;border-radius:24px;background:#fff;color:var(--ink);box-shadow:0 30px 80px rgba(0,10,40,.4)}
.rmcard h2{margin:0;font:800 26px/1.15 var(--f-display);color:var(--royal)}
.rmcard p{margin:0;font:600 15px/1.5 var(--f-body)}
.rmcard .rmnote{padding:10px 12px;border-radius:12px;background:#FFF4D1;color:#6B4D00;font-size:14px}
.linkbtn{border:0;background:none;padding:0;font:800 14px var(--f-body);color:var(--royal);text-decoration:underline;cursor:pointer}
.rmact{display:flex;gap:10px;margin-top:4px}
.rmact .btn{flex:1}
.btn.dangerfill{background:#D2364E;color:#fff;box-shadow:0 10px 24px rgba(210,54,78,.3)}
.btn.dangerfill:disabled{opacity:.7}
.admtoast{position:fixed;left:50%;bottom:26px;z-index:60;transform:translateX(-50%);padding:13px 20px;border-radius:14px;background:#0B3E8C;color:#fff;font:700 15px/1.3 var(--f-body);box-shadow:0 14px 34px rgba(0,10,40,.3);animation:pop .3s both}
.admwarn{margin:0;padding:12px 16px;border-radius:14px;background:#FFF4D1;color:#6B4D00;font:700 14px/1.4 var(--f-body)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpis div{padding:14px 16px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(10,40,90,.05)}
.kpis span{display:block;font:800 11.5px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpis strong{display:block;margin-top:6px;font:800 30px/1 var(--f-display);color:var(--royal);font-variant-numeric:tabular-nums}
.admh2{display:flex;align-items:baseline;gap:10px;margin:6px 0 0;font-size:22px;color:var(--ink)}
.admh2 svg{align-self:center;color:#E0A100}
.admh2 small{font:700 13px/1 var(--f-body);color:var(--muted)}
.top3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tcard{position:relative;display:flex;align-items:center;gap:14px;padding:18px 18px 18px 16px;border-radius:22px;background:#fff;border:2px solid var(--line);overflow:hidden}
.tcard.t1{border-color:#F2C04A;background:linear-gradient(135deg,#FFF8E1,#fff 60%)}
.tcard.t2{border-color:#C9D3DE;background:linear-gradient(135deg,#F3F6FA,#fff 60%)}
.tcard.t3{border-color:#E3B18A;background:linear-gradient(135deg,#FCF1E8,#fff 60%)}
.tcard.empty{opacity:.6;border-style:dashed}
.tcard .medal{font-size:34px;line-height:1}
.tcard .rface.big{width:58px;height:58px}
.tcard .rface.big .ini{font-size:22px}
.tcard b{display:block;font:800 19px/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard div{min-width:0}
.tcard span:not(.medal):not(.rface):not(.ini){display:block;font:700 14px/1.3 var(--f-body);color:var(--royal);font-variant-numeric:tabular-nums}
.tcard em{display:block;font:700 12.5px/1.3 var(--f-body);font-style:normal;color:var(--muted)}
.admbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.admbar input{height:44px;width:min(300px,100%);border-radius:12px;border:2px solid var(--line);padding:0 14px;font:600 15px var(--f-body);background:#fff;outline:none}
.admbar input:focus{border-color:var(--cyan)}
.admtable{overflow-x:auto;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(10,40,90,.06)}
.admtable table{width:100%;border-collapse:collapse;font:600 14.5px/1.3 var(--f-body);min-width:860px}
.admtable th{position:sticky;top:0;padding:12px 14px;text-align:left;background:#F4F9FC;font:800 11.5px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.admtable td{padding:10px 14px;border-bottom:1px solid #EDF3F7;vertical-align:middle}
.admtable tr:last-child td{border-bottom:0}
.admtable .num{text-align:right;font-variant-numeric:tabular-nums}
.admtable th.num{text-align:right}
.admtable .pos{width:54px;font:800 17px/1 var(--f-display);color:var(--royal);text-align:center}
.admtable tr.win td{background:#FFFBEB}
.admtable tr.w1 td{background:#FFF6D6}
.admtable tr.flash td{animation:flashrow 1.6s ease-out}
@keyframes flashrow{0%{background:#C9F5FB}100%{background:transparent}}
.admtable .who{display:flex;align-items:center;gap:10px}
.admtable .who .rface{width:34px;height:34px}
.admtable .who .rface .ini{font-size:13px}
.admtable .who b{font-weight:800}
.acc{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.acc b{font:800 17px/1 var(--f-display);color:var(--ink)}
.acc i{display:inline-block;width:70px;height:6px;border-radius:99px;background:#E3EEF4;overflow:hidden;margin-left:4px}
.acc u{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--royal))}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font:800 12.5px/1 var(--f-body);white-space:nowrap}
.tag.done{background:#E6FAFC;color:#056B7A}
.tag.play{background:#E8F7EF;color:#0B7A4C}
.muted{color:var(--muted);font-weight:600}
.empty{padding:28px!important;text-align:center;color:var(--muted)}
.admfoot{margin:0;font:600 13px/1.4 var(--f-body);color:var(--muted)}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top3{grid-template-columns:1fr}
  .admlogo{display:none}
}

}

const MIN_FAST = Math.ceil(TOTAL * .7);

const Board = {
  live: /^https:\/\//.test(LB_URL),
  base(){ return `${LB_URL.replace(/\/+$/, '')}/salas/${SALA}/jogadores`; },
  localKey: 'matchPerfeito.local.' + SALA,
  localAll(){ try { return JSON.parse(localStorage.getItem(this.localKey) || '{}') || {}; } catch (e) { return {}; } },
  async put(id, rec){
    if (!this.live){
      const all = this.localAll(); all[id] = rec;
      try { localStorage.setItem(this.localKey, JSON.stringify(all)); } catch (e) {}
      return;
    }
    const r = await fetch(`${this.base()}/${id}.json`, {method: 'PUT', body: JSON.stringify(rec)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
  },
  async all(){
    if (!this.live) return this.localAll();
    const r = await fetch(`${this.base()}.json`, {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return (await r.json()) || {};
  },
  /* stream: true usa conexão ao vivo (só o telão); os celulares consultam a cada poucos segundos */
  watch(cb0, {stream = false, every = 5000} = {}){
    let stop = false, timer = 0, es = null, data = {}, onStorage = null, rt = 0, last;
    const cb = d => { last = d; if (ROD.ready || d === null) cb0(d); };
    const rodPoll = async () => {
      if (stop) return;
      const was = ROD.ready, changed = await refreshRodada();
      if (!stop && last !== undefined && (changed || !was)) cb0(last);
      if (!stop) rt = setTimeout(rodPoll, 6000);
    };
    rodPoll();
    const poll = async () => {
      if (stop) return;
      try { cb(await this.all()); } catch (e) { cb(null); }
      if (!stop) timer = setTimeout(poll, every);
    };
    if (stream && this.live && window.EventSource){
      let fails = 0;
      es = new EventSource(`${this.base()}.json`);
      const apply = (ev, merge) => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (!m) return;
        const parts = (m.path || '/').split('/').filter(Boolean);
        if (!parts.length){ if (merge) Object.assign(data, m.data || {}); else data = m.data || {}; }
        else {
          let o = data;
          for (let k = 0; k < parts.length - 1; k++){ o[parts[k]] = o[parts[k]] || {}; o = o[parts[k]]; }
          const last = parts[parts.length - 1];
          if (merge) o[last] = Object.assign(o[last] || {}, m.data || {});
          else if (m.data === null) delete o[last];
          else o[last] = m.data;
        }
        fails = 0; cb(data);
      };
      es.addEventListener('put', e => apply(e, false));
      es.addEventListener('patch', e => apply(e, true));
      es.onerror = () => { if (++fails > 3 && es){ es.close(); es = null; cb(null); poll(); } };
    } else poll();
    if (!this.live){ onStorage = e => { if (e.key === this.localKey) cb(this.localAll()); }; window.addEventListener('storage', onStorage); }
    return () => { stop = true; clearTimeout(timer); clearTimeout(rt); if (es) es.close(); if (onStorage) window.removeEventListener('storage', onStorage); };
  }
};
/* Rodada: o admin zera o ranking começando uma rodada nova. Cada participação guarda a rodada em que foi jogada,
   e as listas mostram só a rodada atual. Quem já tinha jogado ganha uma tentativa nova valendo ponto. */
const ROD = {v: 0, at: 0, ready: false};
const RODKEY = 'matchPerfeito.rodada.' + SALA;
Board.rodUrl = () => `${LB_URL.replace(/\/+$/, '')}/salas/${SALA}/rodada`;
Board.getRodada = async () => {
  if (!Board.live){ try { return +localStorage.getItem(RODKEY) || 0; } catch (e) { return 0; } }
  const r = await fetch(`${Board.rodUrl()}/valor.json`, {cache: 'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return +(await r.json()) || 0;
};
Board.novaRodada = async chave => {
  const v = Date.now();
  if (!Board.live){ try { localStorage.setItem(RODKEY, String(v)); localStorage.removeItem(Board.localKey); } catch (e) {} return v; }
  /* A regra do Firebase só aceita se a chave for "senha:valor": sem a senha, ninguém troca a rodada */
  const r = await fetch(`${Board.rodUrl()}.json`, {method: 'PUT', body: JSON.stringify({valor: String(v), chave: `${chave}:${v}`})});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return v;
};
async function refreshRodada(){
  let v; try { v = await Board.getRodada(); } catch (e) { ROD.ready = true; return false; }
  const changed = v !== ROD.v; ROD.v = v; ROD.at = Date.now(); ROD.ready = true;
  if ((RANK.rod || 0) !== v){
    RANK = {pid: uid(), done: false, rod: v}; saveRank();
    if (S && S.t0 && !S.t1 && !S.ranked){ S.ranked = true; save(); }
  }
  return changed;
}

const fmtT = ms => { const s = Math.round((ms || 0) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const fmtP = n => (n || 0).toLocaleString('pt-BR');
const ETAPA = {filtros: 'Filtros', perfis: 'Perfis', chat: 'Chat', fim: 'Terminou'};

function faceOf(r){
  const parts = String(r.nome || '?').trim().split(/\s+/);
  const ini = ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
  let h = 0; for (const ch of String(r.nome || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `<span class="ini" style="background:${INI_COLORS[h % INI_COLORS.length]}">${esc(ini)}</span>`;
}
/* Lista com posições animadas: cada linha desliza para o novo lugar quando o placar muda */
function listUpdater(container, {rowH = 64, skip = 0, max = 50, meId = null, mode = 'pts'} = {}){
  const rows = new Map();
  return list => {
    const shown = list.slice(skip, skip + max), seen = new Set();
    shown.forEach((r, i) => {
      let el = rows.get(r.id);
      if (!el){
        el = document.createElement('div');
        el.className = 'lrow' + (r.id === meId ? ' me' : '');
        el.style.height = (rowH - 8) + 'px';
        el.style.transform = `translateY(${i * rowH + 12}px)`; el.style.opacity = '0';
        el.innerHTML = `<span class="pos"></span><span class="rface"></span><span class="rbody"></span>`;
        container.appendChild(el); rows.set(r.id, el);
        requestAnimationFrame(() => { el.style.opacity = '1'; });
      }
      el.querySelector('.pos').textContent = (skip + i + 1) + 'º';
      const face = faceOf(r), rf = el.querySelector('.rface');
      if (rf._h !== face){ rf.innerHTML = face; rf._h = face; }
      const status = r.etapa === 'fim' ? `${TIER_E[r.tier] || '✓'} terminou em ${fmtT(r.t)}` : `<i class="livedot"></i> jogando · ${ETAPA[r.etapa] || 'início'}`;
      const body = mode === 'time'
        ? `<span class="rname"><b>${esc(r.nome)}${r.id === meId ? ' <em>você</em>' : ''}</b><small>${fmtP(r.pts)} pts · ${r.acertos} acertos</small></span><span class="rpts">${fmtT(r.t)}<small>tempo</small></span>`
        : `<span class="rname"><b>${esc(r.nome)}${r.id === meId ? ' <em>você</em>' : ''}</b><small>${status}</small></span><span class="rpts">${fmtP(r.pts)}<small>pts</small></span>`;
      const rb = el.querySelector('.rbody');
      if (rb._h !== body){ rb.innerHTML = body; rb._h = body; }
      el.style.transform = `translateY(${i * rowH}px)`;
      seen.add(r.id);
    });
    rows.forEach((el, id) => { if (!seen.has(id)){ el.remove(); rows.delete(id); } });
    container.style.height = (shown.length * rowH) + 'px';
  };
}

function floaters(n, seed){
  const cols = ['#2148A0', '#085FAA', '#FFFFFF', '#3BA0E0', '#FFFFFF', '#1B5FB0'];
  let s = '', x = seed || 7;

}

VIEWS.swipe = () => {
  if (S.p >= PROFILES.length){ go('matchT'); return; }
  app.innerHTML = `<section class="screen swipe">${topbar('Etapa 2 de 3 · Perfis', `<span id="pc">${S.p + 1}</span> de ${PROFILES.length}`)}
    <div class="deck" id="deck"></div>
    <div class="actions">
      <div><button class="act no" id="no" aria-label="Passar">${ico('x', 30, 4.4)}</button><span class="act-label">Passa</span></div>
      <div><button class="act yes" id="yes" aria-label="Dar match">${HEART(32, '#fff')}</button><span class="act-label">Match</span></div>
    </div>
    <div class="toast" id="toast" role="status"></div></section>`;
  const deck = $('#deck'), tok = runToken, bYes = $('#yes'), bNo = $('#no');
  const NEXT_T = 'translate3d(0,16px,0) scale(.94)';
  const T = p => `translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0) rotate(${p.r.toFixed(2)}deg)`;
  const top = () => deck.querySelector(`.card[data-i="${S.p}"]`);
  const under = () => deck.querySelector(`.card[data-i="${S.p + 1}"]`);
  let busy = false, toastT = 0;

  const setUnder = k => { const n = under(); if (n) n.style.transform = `translate3d(0,${(16 * (1 - k)).toFixed(1)}px,0) scale(${(.94 + .06 * k).toFixed(4)})`; };
  const setBtns = dx => {
    const k = Math.min(1, Math.abs(dx) / 120);
    bYes.style.transform = `scale(${dx > 0 ? 1 + .18 * k : 1 - .1 * k})`;
    bNo.style.transform = `scale(${dx < 0 ? 1 + .18 * k : 1 - .1 * k})`;
    bYes.classList.toggle('hot', dx > 50); bNo.classList.toggle('hot', dx < -50);
  };
  const resetBtns = () => { bYes.style.transform = bNo.style.transform = ''; bYes.classList.remove('hot'); bNo.classList.remove('hot'); };
  const setStamps = (card, dx) => {
    const k = Math.min(1, Math.abs(dx) / (card.clientWidth * .3));
    const y = card.querySelector('.stamp.yes'), n = card.querySelector('.stamp.no');
    y.style.opacity = dx > 0 ? k : 0; n.style.opacity = dx < 0 ? k : 0;
    y.style.setProperty('--k', dx > 0 ? k : 0); n.style.setProperty('--k', dx < 0 ? k : 0);
  };
  const toast = (liked, p) => {
    const ok = liked === p.m;
    const title = liked ? (ok ? 'Deu match! 💘' : 'Ops, ghosting à vista 👻') : (ok ? 'Boa, passou certo! 👋' : 'Eita, deixou escapar 💔');
    const t = $('#toast'); t.className = 'toast' + (ok ? '' : ' bad');
    t.innerHTML = `<b>${title}</b><p>${esc(p.why)}</p>`;
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
  };

  /* Arremesso: segue a velocidade e a direção do dedo, como no Tinder */
  function fly(card, liked, vx = 0, vy = 0, viaButton = false){
    if (busy) return; busy = true;
    const i = S.p, p = PROFILES[i], dir = liked ? 1 : -1, n = under();
    S.ans.p[i] = liked; S.p = i + 1; save(); buzz(liked === p.m ? 15 : [10, 40, 10]); bump(liked === p.m);
    const from = card._pos || {x: 0, y: 0, r: 0};
    const endX = dir * (window.innerWidth + card.clientWidth);
    const speed = Math.max(Math.abs(vx), viaButton ? 1.5 : 1.15);
    const dur = Math.round(Math.max(260, Math.min(560, Math.abs(endX - from.x) / speed)));
    const endY = viaButton ? -70 : from.y + Math.max(-1.4, Math.min(1.4, vy)) * dur * .55;
    const endR = viaButton ? dir * 28 : from.r + dir * (14 + Math.min(16, Math.abs(vx) * 9));
    setStamps(card, dir * 9999);
    card.classList.add('flying');
    const frames = viaButton
      ? [{transform: T(from), offset: 0}, {transform: T({x: -dir * 18, y: 4, r: -dir * 3}), offset: .2}, {transform: T({x: endX, y: endY, r: endR}), offset: 1}]
      : [{transform: T(from)}, {transform: T({x: endX, y: endY, r: endR})}];
    const total = viaButton ? dur + 160 : dur;
    card.animate(frames, {duration: total, easing: viaButton ? 'cubic-bezier(.45,0,.6,1)' : 'cubic-bezier(.12,.62,.32,1)', fill: 'forwards'});
    if (n) n.animate([{transform: n.style.transform || NEXT_T}, {transform: 'translate3d(0,0,0) scale(1)'}], {duration: Math.min(total, 420), easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards'});
    resetBtns();
    (liked ? bYes : bNo).animate([{transform: 'scale(1)'}, {transform: 'scale(1.24)'}, {transform: 'scale(1)'}], {duration: 340, easing: 'ease-out'});
    toast(liked, p);
    $('.prog i').style.width = (answered() / TOTAL * 100) + '%';
    setTimeout(() => {
      if (tok !== runToken) return;
      card.remove();
      if (S.p >= PROFILES.length){ setTimeout(() => { if (tok === runToken) go('matchT'); }, 1300); return; }
      $('#pc').textContent = S.p + 1;
      if (n){ n.classList.remove('next'); n.style.transform = ''; n.getAnimations().forEach(a => a.cancel()); bind(n); }
      if (S.p + 1 < PROFILES.length){
        deck.insertAdjacentHTML('afterbegin', cardHTML(S.p + 1, 'next'));
        under().animate([{transform: 'translate3d(0,30px,0) scale(.88)', opacity: 0}, {transform: NEXT_T, opacity: 1}], {duration: 300, easing: 'ease-out'});
      }
      busy = false;
    }, total);
  }

  /* Volta com efeito de mola quando o gesto não passa do limite */
  function springBack(card){
    const from = card._pos || {x: 0, y: 0, r: 0};
    card._pos = {x: 0, y: 0, r: 0}; card.style.transform = '';
    card.animate([
      {transform: T(from), offset: 0},
      {transform: T({x: -from.x * .08, y: -from.y * .08, r: -from.r * .1}), offset: .55},
      {transform: T({x: from.x * .02, y: 0, r: from.r * .02}), offset: .8},
      {transform: 'translate3d(0,0,0) rotate(0deg)', offset: 1}
    ], {duration: 560, easing: 'cubic-bezier(.25,.8,.35,1)'});
    card.querySelectorAll('.stamp').forEach(st => {
      const o = +st.style.opacity || 0;
      st.style.opacity = 0; st.style.setProperty('--k', 0);
      if (o) st.animate([{opacity: o}, {opacity: 0}], {duration: 200});
    });
    const n = under();
    if (n){ const cur = n.style.transform || NEXT_T; n.style.transform = ''; n.animate([{transform: cur}, {transform: NEXT_T}], {duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)'}); }
    resetBtns();
  }

  function bind(card){
    if (!card || card._bound) return; card._bound = true;
    let drag = false, pid = null, sx = 0, sy = 0, dx = 0, dy = 0, grabTop = true, samples = [], raf = 0;
    const paint = () => {
      raf = 0;
      const cw = card.clientWidth;
      card._pos = {x: dx, y: dy, r: (dx / cw) * 24 * (grabTop ? 1 : -1)};
      card.style.transform = T(card._pos);
      setStamps(card, dx);
      setUnder(Math.min(1, Math.abs(dx) / (cw * .45)));
      setBtns(dx);
    };
    card.addEventListener('pointerdown', e => {
      if (busy || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
      drag = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0;
      const rc = card.getBoundingClientRect(); grabTop = (e.clientY - rc.top) < rc.height * .55;
      samples = [{x: e.clientX, y: e.clientY, t: performance.now()}];
      card.getAnimations().forEach(a => a.cancel());
      try { card.setPointerCapture(pid); } catch (_) {}
      card.classList.add('grabbing');
    });
    card.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== pid) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      const now = performance.now(); samples.push({x: e.clientX, y: e.clientY, t: now});
      while (samples.length > 2 && now - samples[0].t > 90) samples.shift();
      if (!raf) raf = requestAnimationFrame(paint);
    });
    const end = e => {
      if (!drag || (e && e.pointerId !== pid)) return;
      drag = false; card.classList.remove('grabbing');
      if (raf){ cancelAnimationFrame(raf); paint(); }
      const now = performance.now();
      while (samples.length > 1 && now - samples[0].t > 110) samples.shift();
      const a = samples[0], b = samples[samples.length - 1], dt = Math.max(16, b.t - a.t);
      const vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt;
      const flick = Math.abs(vx) > .35 && Math.abs(dx) > 30 && Math.sign(vx) === Math.sign(dx);
      if (Math.abs(dx) > card.clientWidth * .33 || flick) fly(card, dx > 0, vx, vy);
      else if (Math.abs(dx) > 2 || Math.abs(dy) > 2) springBack(card);
      else { card._pos = {x: 0, y: 0, r: 0}; card.style.transform = ''; setUnder(0); resetBtns(); }
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);
    card.addEventListener('lostpointercapture', () => { if (drag) end(); });
  }

  bYes.onclick = () => { const c = top(); if (c && !busy) fly(c, true, 0, 0, true); };
  bNo.onclick = () => { const c = top(); if (c && !busy) fly(c, false, 0, 0, true); };
  document.onkeydown = e => { if (S.screen !== 'swipe') return; if (e.key === 'ArrowRight') bYes.click(); if (e.key === 'ArrowLeft') bNo.click(); };

  deck.innerHTML = (S.p + 1 < PROFILES.length ? cardHTML(S.p + 1, 'next') : '') + cardHTML(S.p);
  bind(top());
  /* Dica de gesto no primeiro card, como o "balançadinho" de onboarding */
  if (S.p === 0 && !S.ans.p.length) setTimeout(() => {
    const c = top();
    if (c && !busy && tok === runToken) c.animate([
      {transform: 'none'}, {transform: T({x: 46, y: 0, r: 3.6})}, {transform: T({x: -34, y: 0, r: -2.6})}, {transform: 'none'}
    ], {duration: 1400, easing: 'ease-in-out'});
  }, 800);
};

VIEWS.chat = () => {
  const h = PROFILES[HELENA], tok = runToken, ROLE = `${h.r} · online`;
  app.innerHTML = `<section class="screen chat">
    <div class="chathead"><button class="av" id="hv" aria-label="Ver perfil de ${esc(h.n)}">${avatar(h.av, true)}</button>
      <button class="who" id="hv2"><b>${esc(h.n)}</b><small id="st"><span class="online"></span>${esc(ROLE)}</small></button>${ptsChip()}</div>
    <div class="chatprog"><div class="prog"><i style="width:${answered() / TOTAL * 100}%"></i></div><div class="meta"><span class="eyebrow">Etapa 3 de 3 · Chat</span><span class="count" id="cc">Decisão ${Math.min(S.c + 1, CHAT.length)} de ${CHAT.length}</span></div></div>
    <div class="msgs" id="msgs" aria-live="polite"><div class="day">Hoje</div>
      <div class="matchcard"><div class="mc-faces"><span>${AREA_AV}</span><span>${avatar(h.av, true)}</span></div><b>Você e ${esc(h.n.split(' ')[0])} deram match 🔥</b><small>A demanda chegou. Ela responde a quem conversa com propósito, então capricha 😉</small></div></div>
    <div class="replies" id="rep"></div></section>`;
  const msgs = $('#msgs'), rep = $('#rep'), alive = () => tok === runToken;
  const down = () => requestAnimationFrame(() => msgs.scrollTo({top: msgs.scrollHeight, behavior: 'smooth'}));
  const add = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; msgs.appendChild(d); down(); return d; };
  const status = (txt, on = true) => { $('#st').innerHTML = (on ? '<span class="online"></span>' : '') + esc(txt); };
  const typing = async ms => { const t = add('typing', '<i></i><i></i><i></i>'); await sleep(ms); t.remove(); };
  /* Helena fala em sequência, com "digitando…" proporcional ao tamanho da mensagem */
  const say = async lines => {
    for (const l of lines){
      status('digitando…'); await typing(Math.min(1700, 450 + l.length * 16));
      if (!alive()) return false;
      status(ROLE); add('b them', esc(l)); await sleep(260);
      if (!alive()) return false;
    }
    return true;
  };
  const me = text => { const w = document.createElement('div'); w.className = 'mewrap'; w.innerHTML = `<div class="b me">${esc(text)}</div>`; msgs.appendChild(w); down(); return w; };
  const mark = (w, ok, q, silent) => {
    if (!silent) w.querySelector('.b').insertAdjacentHTML('beforeend', `<span class="react" aria-hidden="true">${ok ? '❤️' : '😬'}</span>`);
    w.insertAdjacentHTML('beforeend', `<div class="note${ok ? '' : ' bad'}">${ok ? '✓ ' + esc(q.ok) : '✕ ' + esc(q.bad)}</div>`);
    down();
  };
  const ghostsAt = i => i === CHAT.length - 1 && score().chatTier === 'ghost';
  const replay = i => {
    const q = CHAT[i], k = S.ans.c[i], ok = k === q.c;
    if (q.sys) add('sys', esc(q.sys));
    q.msg.forEach(l => add('b them', esc(l)));
    const w = me(q.o[k][0]);
    if (ghostsAt(i)){ mark(w, ok, q, true); return; }
    q.o[k][1].forEach(l => add('b them', esc(l)));
    mark(w, ok, q);
    if (!ok) q.bridge.forEach(l => add('b them', esc(l)));
    const m = moodAt(i); if (m) add('b them', esc(m));
  };
  const step = async i => {
    const q = CHAT[i];
    $('#cc').textContent = `Decisão ${i + 1} de ${CHAT.length}`;
    if (q.sys){ await sleep(450); if (!alive()) return; add('sys', esc(q.sys)); await sleep(300); }
    else if (i === 0){ await sleep(700); if (!alive()) return; }
    if (!await say(q.msg)) return;
    rep.innerHTML = `<span class="hint">Responder</span>` + q.ord.map(k => `<button class="reply" data-k="${k}">${esc(q.o[k][0])}</button>`).join('');
    rep.scrollTop = 0; down();
    rep.querySelectorAll('.reply').forEach(b => b.onclick = async () => {
      const k = +b.dataset.k, ok = k === q.c;
      rep.innerHTML = '';
      S.ans.c[i] = k; save(); buzz(ok ? 12 : [10, 40, 10]); bump(ok);
      $('.chatprog .prog i').style.width = (answered() / TOTAL * 100) + '%';
      const w = me(q.o[k][0]);
      if (ghostsAt(i)){ mark(w, ok, q, true); S.c = i + 1; save(); ending(); return; }
      await sleep(550); if (!alive()) return;
      if (!await say(q.o[k][1])) return;
      mark(w, ok, q);
      if (!ok){ await sleep(450); if (!alive()) return; if (!await say(q.bridge)) return; }
      const m = moodAt(i); if (m){ await sleep(350); if (!alive()) return; if (!await say([m])) return; }
      S.c = i + 1; save();
      await sleep(650); if (!alive()) return;
      if (S.c < CHAT.length) step(S.c); else ending();
    });
  };
  const ending = async () => {
    const tier = score().chatTier, E = ENDINGS[tier];
    $('#cc').textContent = 'Conversa concluída';
    if (tier === 'ghost'){
      /* Ghosting de verdade: visualiza, começa a digitar, desiste e some */
      const ws = msgs.querySelectorAll('.mewrap'), lw = ws[ws.length - 1];
      await sleep(900); if (!alive()) return;
      if (lw && !lw.querySelector('.vis')) lw.insertAdjacentHTML('beforeend', '<div class="vis">Visto</div>'); down();
      await sleep(1100); if (!alive()) return;
      status('digitando…'); const t = add('typing', '<i></i><i></i><i></i>');
      await sleep(1700); t.remove(); if (!alive()) return; status(ROLE);
      await sleep(1500); if (!alive()) return;
      status(E.status, false);
      add('sys rsvp ghost', esc(E.rsvp));
      await sleep(700); if (!alive()) return;
      add('sys', esc(E.sys));
      await sleep(700); if (!alive()) return;
      rep.innerHTML = `<button class="btn primary" id="res">Ver meu resultado</button>`; down();
      $('#res').onclick = () => go('result');
      return;
    }
    await sleep(500); if (!alive()) return;
    if (!await say(E.say)) return;
    await sleep(400); if (!alive()) return;
    add('sys rsvp ' + tier, esc(E.rsvp));
    if (tier === 'match'){
      await sleep(700); if (!alive()) return;
      add('sys', esc(E.sys)); await sleep(500);
      for (const t of (E.talk || [])){
        if (t.after && t.after.length && !await say(t.after)) return;
        if (t.opts){
          const tried = new Set();
          for (;;){
            rep.innerHTML = `<span class="hint">Responder</span>` + t.ord.filter(k => !tried.has(k)).map(k => `<button class="reply" data-k="${k}">${esc(t.opts[k][0])}</button>`).join('');
            rep.scrollTop = 0; down();
            const k = await new Promise(r => rep.querySelectorAll('.reply').forEach(b => { b.onclick = () => r(+b.dataset.k); }));
            if (!alive()) return;
            const ok = k === t.c;
            rep.innerHTML = ''; const w = me(t.opts[k][0]); buzz(ok ? 12 : [10, 40, 10]);
            await sleep(500); if (!alive()) return;
            w.querySelector('.b').insertAdjacentHTML('beforeend', `<span class="react" aria-hidden="true">${ok ? '💙' : '😬'}</span>`);
            if (!await say(t.opts[k][1])) return;
            if (ok) break;
            tried.add(k); await sleep(300); if (!alive()) return;
          }
        } else {
          rep.innerHTML = `<span class="hint">Responder</span><button class="reply" id="er">${esc(t.reply)}</button>`; down();
          await new Promise(r => { $('#er').onclick = r; });
          if (!alive()) return;
          rep.innerHTML = ''; const w = me(t.reply);
          await sleep(500); if (!alive()) return;
          w.querySelector('.b').insertAdjacentHTML('beforeend', '<span class="react" aria-hidden="true">💙</span>');
        }
        if (t.sys){ add('sys', esc(t.sys)); await sleep(500); if (!alive()) return; }
        if (t.last && t.last.length && !await say(t.last)) return;
        await sleep(300); if (!alive()) return;
      }
    }
    await sleep(600); if (!alive()) return;
    rep.innerHTML = `<button class="btn primary" id="res">Ver meu resultado</button>`; down();
    $('#res').onclick = () => go('result');
  };
  const showProfile = () => {
    const d = document.createElement('div'); d.className = 'sheet profile-sheet';
    d.innerHTML = `<div class="panel"><header><h3>${esc(h.n)}</h3><button class="x" aria-label="Fechar">${ico('close', 20, 4)}</button></header><div class="pcard">${cardHTML(HELENA)}</div></div>`;
    app.querySelector('.screen').appendChild(d);
    const pc = d.querySelector('.card'); pc.style.touchAction = 'auto'; pc.style.cursor = 'default';
    d.onclick = e => { if (e.target === d || e.target.closest('.x')) d.remove(); };
  };
  $('#hv').onclick = showProfile; $('#hv2').onclick = showProfile;
  for (let i = 0; i < S.c; i++) replay(i);
  if (S.c < CHAT.length) step(S.c); else ending();
};

VIEWS.result = () => {
  const sc = score(), R = RESULTS[sc.tier], t = sc.tier, m = me();

  /* Envia o placar final antes de consultar a posição */
  const final = S.ranked ? Board.put(RANK.pid, record()).catch(() => { syncScore(); }) : Promise.resolve();
  if (S.ranked && !RANK.done){ RANK.done = true; saveRank(); }
  const C = 2 * Math.PI * 76, track = t === 'quase' ? '#BFE3EE' : 'rgba(255,255,255,.22)', bar = t === 'quase' ? 'url(#rg)' : '#fff';
  let deco = '';
  if (t === 'match') for (let k = 0; k < 16; k++) deco += `<span class="riser" style="left:${(k * 6.7 + 2) % 96}%;animation-duration:${6 + (k % 5)}s;animation-delay:-${(k * .6).toFixed(1)}s">${k % 2 ? THUMB(18 + (k % 3) * 7, '#fff') : HEART(16 + (k % 4) * 5, k % 3 ? '#fff' : '#9FF0FA')}</span>`;

      <div class="ring" role="img" aria-label="Compatibilidade de ${sc.pct}%">

          <circle cx="88" cy="88" r="76" fill="none" stroke="${track}" stroke-width="14"/>
          <circle id="arc" cx="88" cy="88" r="76" fill="none" stroke="${bar}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/></svg>
        <div class="val"><strong id="pct">0%</strong><span>compatibilidade</span></div>
      </div>
      <span class="hits">${sc.total} de ${TOTAL} acertos · ${fmtP(sc.total * PTS)} pts${S.t0 && S.t1 ? ` · ⏱ ${fmtT(S.t1 - S.t0)}` : ''}</span>
      <h1 class="rtitle">${R.title}</h1>
      <p class="rsub">${esc(R.sub)}</p>
      <p class="rtext">${esc(R.text)}</p>
      ${sc.chatTier !== sc.overall && sc.tier === sc.chatTier ? `<p class="rnote">Seus filtros e perfis foram bem, mas a Helena ${sc.chatTier === 'ghost' ? 'deu ghosting e não foi ao evento' : 'deixou o date para outra oportunidade'}: no CRM, o processo também conta.</p>` : ''}
      <div class="break"><div><strong>${sc.f}/${FILTERS.length}</strong><span>Filtros</span></div><div><strong>${sc.p}/${PROFILES.length}</strong><span>Perfis</span></div><div><strong>${sc.c}/${CHAT.length}</strong><span>Chat</span></div></div>
      <p class="rankline" id="rankline">${S.ranked ? 'Calculando sua posição no ranking…' : S.ranked === false ? 'Partida de treino: só a primeira partida conta para o ranking.' : ''}</p>
    </div>
    <div class="foot"><button class="btn ${t === 'quase' ? 'primary' : 'light'}" id="rk">${ico('trophy', 20, 3.2)} Ver ranking ao vivo</button>
      <div class="row2b"><button class="btn ${t === 'quase' ? 'outline' : 'outline-w'} small" data-act="${R.a[1]}">${R.a[0]}</button><button class="btn ${t === 'quase' ? 'outline' : 'outline-w'} small" data-act="${R.b[1]}">${R.b[0]}</button></div></div></section>`;
  $('#rk').onclick = () => go('ranking');
  if (S.ranked) final.then(() => Board.all()).then(data => {
    const L = rankedList(data), F = fastList(data), i = L.findIndex(r => r.id === RANK.pid), j = F.findIndex(r => r.id === RANK.pid), el = $('#rankline');
    if (el && i >= 0) el.innerHTML = `${esc(m.nome)}, você está em <b>${i + 1}º lugar</b> de ${L.length} em pontos` + (j >= 0 ? ` e em <b>${j + 1}º</b> entre os mais rápidos` : '');
  }).catch(() => { const el = $('#rankline'); if (el) el.textContent = 'Não consegui consultar o ranking agora. Toque em “Ver ranking ao vivo”.'; });
  requestAnimationFrame(() => requestAnimationFrame(() => { const a = $('#arc'); if (a) a.style.strokeDashoffset = C * (1 - sc.total / TOTAL); }));
  const el = $('#pct'), t0 = performance.now();
  const tick = now => { const k = Math.min(1, (now - t0) / 1100); el.textContent = Math.round(sc.pct * (1 - Math.pow(1 - k, 3))) + '%'; if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  if (t === 'match') buzz([20, 60, 20, 60, 40]);
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => b.dataset.act === 'review' ? review() : restart());
};

function restart(){ S = fresh(); go('mission'); }

function review(){
  const ok = '<span class="ic">' + ico('check', 14, 6) + '</span>', bad = '<span class="ic">' + ico('x', 12, 6) + '</span>';
  let h = '<h5>Etapa 1 · Filtros</h5>';
  FILTERS.forEach((q, i) => { const k = S.ans.f[i], g = k === q.c;
    h += `<div class="ri ${g ? '' : 'bad'}">${g ? ok : bad}<div><h4>${esc(q.q)}</h4><p>Você: <b>${esc(q.o[k] ?? '—')}</b></p>${g ? '' : `<p>Certo: <b>${esc(q.o[q.c])}</b></p>`}<p>${esc(g ? q.ok : errOf(q, k))}</p></div></div>`; });
  h += '<h5>Etapa 2 · Perfis</h5>';
  PROFILES.forEach((p, i) => { const v = S.ans.p[i], g = v === p.m;
    h += `<div class="ri ${g ? '' : 'bad'}">${g ? ok : bad}<div><h4>${esc(p.n)} · ${esc(p.r)}</h4><p>Você: <b>${v ? 'deu match' : 'passou'}</b> · Gabarito: <b>${p.m ? 'Match' : 'Não match'}</b></p><p>${esc(p.why)}</p></div></div>`; });
  h += '<h5>Etapa 3 · Chat com a Helena</h5>';

    h += `<div class="ri ${g ? '' : 'bad'}">${g ? ok : bad}<div><h4>Decisão ${i + 1} · ${esc(q.t)}</h4><p>Você: <b>“${esc(q.o[k] ? q.o[k][0] : '—')}”</b></p>${g ? '' : `<p>Certo: <b>“${esc(q.o[q.c][0])}”</b></p>`}<p>${esc(q.seal)}</p></div></div>`; });
  const d = document.createElement('div'); d.className = 'sheet';
  d.innerHTML = `<div class="panel" role="dialog" aria-label="Minhas respostas"><header><h3>Minhas respostas</h3><button class="x" aria-label="Fechar">${ico('close', 20, 4)}</button></header><div class="list">${h}</div></div>`;
  app.querySelector('.screen').appendChild(d);
  d.onclick = e => { if (e.target === d || e.target.closest('.x')) d.remove(); };
}
